spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/applyflow}
    username: ${DB_USERNAME:applyflow}
    password: ${DB_PASSWORD:applyflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
