spring:
  datasource:
    url: jdbc:h2:mem:applyflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: local-development-secret-that-is-at-least-32-bytes
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174
